<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Ritokko: icona app (quadrata, iOS arrotonda da sé gli angoli) -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4d8d"/>
      <stop offset="0.55" stop-color="#a95cff"/>
      <stop offset="1" stop-color="#ffb547"/>
    </linearGradient>
    <radialGradient id="luce" cx="0.3" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scia" x1="250" y1="300" x2="372" y2="404" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#fondo)"/>
  <rect width="512" height="512" fill="url(#luce)"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- asta e occhiello della R -->
    <path d="M168 396 V132 H262 a88 88 0 0 1 0 176 H168" stroke="#fff" stroke-width="58"/>
    <!-- gamba: la "scia" del tocco magico, che sfuma -->
    <path d="M250 308 L372 404" stroke="url(#scia)" stroke-width="58"/>
  </g>
  <!-- scintilla: il tocco -->
  <path d="M396 96 l13 37 l37 13 l-37 13 l-13 37 l-13 -37 l-37 -13 l37 -13 z" fill="#fff"/>
  <circle cx="436" cy="214" r="9" fill="#fff" opacity="0.8"/>
  <circle cx="418" cy="430" r="7" fill="#fff" opacity="0.55"/>
</svg>
